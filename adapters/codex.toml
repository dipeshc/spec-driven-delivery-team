# Engine adapter: OpenAI Codex CLI (`codex exec`). Contract-tested; real runs
# need the CLI installed.
#
# Approvals and the engine's own sandbox are bypassed because the run is
# confined by its working directory plus the explicit add-dirs, never by the
# engine's sandbox; the orchestrator enforces the wall-clock timeout itself. A
# git worktree's `.git` file points into the main repository's git directory,
# which is why the orchestrator always passes the git common dir as an add-dir.
# `codex exec` refuses to run outside a git repository; `doctor` checks that.
name = "codex"
tested = false
network = true
vision = false
requires_git_repo = true

command = ["codex", "exec", "--dangerously-bypass-approvals-and-sandbox", "--json", "-o", "{out}", "-C", "{cwd}"]
model_args = ["-m", "{model}"]
add_dir = { flag = "--add-dir", style = "repeat" }
prompt = "stdin"
# A lone `-` tells `codex exec` to read the prompt from stdin.
stdin_args = ["-"]
# `-o` writes the final message to a file; stdout carries JSONL events.
streams = true
output = "file"
timeout_exit_codes = []

# Codex model names change often; set [engine.tiers] in config.toml. With no
# model named, the engine's configured default is used for every tier.
[tiers]
frontier = ""
mid = ""
small = ""

# Engine adapter: Claude Code (`claude`). Tested.
#
# A headless print-mode run. Approvals are bypassed because the run is confined
# by its working directory plus the explicit add-dirs, never by the engine's
# sandbox; the orchestrator enforces the wall-clock timeout itself.
name = "claude"
tested = true
network = true
vision = true
# Claude Code runs the hooks this project settings file declares inside every
# headless run; `sdt doctor` warns when it declares any.
project_hooks_file = ".claude/settings.json"

command = ["claude", "-p", "--output-format", "stream-json", "--verbose", "--permission-mode", "bypassPermissions"]
model_args = ["--model", "{model}"]
add_dir = { flag = "--add-dir", style = "once" }
prompt = "stdin"
stdin_args = []
# Events stream as JSON lines (`--verbose` is what print mode needs for that),
# so liveness can be judged by log growth; the final line is the result object,
# whose `result` key is the final message, valid only when `subtype` is
# `success`.
streams = true
output = "json:result"
success = { key = "subtype", value = "success" }
timeout_exit_codes = []

[tiers]
frontier = "opus"
mid = "sonnet"
small = "haiku"
